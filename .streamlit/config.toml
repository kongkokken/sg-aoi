# Streamlit server + theme configuration for the PCBA AOI demo.

[server]
# No browser auto-open, no CORS prompts — required on headless cloud hosts.
headless = true
# Board photos from a phone/webcam are typically 2–10 MB.
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
# Season Group corporate identity (docs/ui_proposal_sg_aoi.md §2):
# coral primary + charcoal dark base. Verdict colors (green/red/amber) are
# set in code and intentionally NOT driven by this theme.
base = "dark"
primaryColor = "#FB6362"
backgroundColor = "#1D252D"
secondaryBackgroundColor = "#343741"
textColor = "#FFFFFF"
font = "sans serif"
