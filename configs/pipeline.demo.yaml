# =============================================================================
# DEMO configuration — management demo with simulated detections (no model)
# =============================================================================
# Copy of configs/pipeline.yaml pre-wired to the synthetic demo assets
# generated by scripts/make_demo_board.py:
#
#   * detection.precomputed_json points at data/demo/detections_ok.json, so
#     Branch A runs WITHOUT a trained/exported PP-YOLOE+ model. The rule
#     engine, fusion, verdict JSON and annotated image are the real thing.
#   * The other two demo scenarios (missing R7 / wrong C3) are selected from
#     the Inspection page in demo mode, or by pointing precomputed_json at
#     data/demo/detections_ng_missing.json / detections_ng_wrong.json.
#   * Deferred checks (orientation, scratches, solder balls, foreign
#     particles) stay OFF, exactly like the phase-1 production config.
#
# Run headless:  python src/infer_pipeline.py --image data/demo/board_ok.jpg \
#                  --config configs/pipeline.demo.yaml
# Run the app:   streamlit run src/app.py
#                (demo mode auto-activates while data/demo/detections_ok.json
#                exists, or force it with AOI_DEMO=1)
# =============================================================================

# --- Branch A: PP-YOLOE+ detection (exported Paddle inference model) -------
detection:
  # Not needed for the demo — precomputed_json below takes precedence.
  model_dir: "models/detection/pcba_ppyoloe"
  # Minimum detection confidence to treat a component as present.
  confidence_threshold: 0.5
  # Device for paddle inference: "cpu" or "gpu"
  device: "cpu"
  # DEMO: scripted detections for the OK board, used INSTEAD of the model.
  # Swap to detections_ng_missing.json / detections_ng_wrong.json (or use the
  # app's scenario selector) to demo the NG flows.
  precomputed_json: "data/demo/detections_ok.json"

# --- Branch B: PatchCore anomaly detection ---------------------------------
anomaly:
  # Exported model from src/train_anomaly.py: an OpenVINO directory or a
  # torch .ckpt. The pipeline auto-detects which. (Absent in the demo —
  # Branch B is skipped with a warning, as in phase 1.)
  model_path: "models/anomaly/patchcore/openvino"
  # Anomaly-score threshold on the [0, 1] normalized score.
  score_threshold: 0.5
  # Minimum pixel area of an anomaly region to report (filters speck noise).
  min_region_area: 64
  device: "cpu"

# --- Golden reference / rule engine ----------------------------------------
golden:
  image: "data/golden/golden_board.jpg"
  expected_components: "data/golden/expected_components.json"
  # IoU between a detection and an expected component bbox at which they are
  # considered "the same part". 0.4 is lenient enough for small part jitter.
  match_iou: 0.4
  # Acceptable orientation error in degrees (check disabled below in demo).
  orientation_tolerance_deg: 30

# --- Which defect checks are active ----------------------------------------
# Demo scope = phase-1 scope: missing parts + wrong parts ONLY (Branch A).
checks:
  missing_part: true      # expected component has no detection       (Branch A, PHASE 1)
  wrong_part: true        # detected class != expected class          (Branch A, PHASE 1)
  wrong_orientation: false # deferred — future Branch-A refinement (aspect heuristic is coarse)
  scratches: false         # deferred — enable when anomaly branch is activated
  solder_balls: false      # deferred — enable when anomaly branch is activated
  foreign_particles: false # deferred — enable when anomaly branch is activated

# --- Output -----------------------------------------------------------------
output:
  results_dir: "results"
  save_annotated: true
  save_json: true
